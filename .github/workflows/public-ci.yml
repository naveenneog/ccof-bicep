name: public-source-ci

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-source-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    name: Public source (Node ${{ matrix.node }})
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '26']
    env:
      CCOF_LIVE_TESTS: '0'
      AZURE_CORE_COLLECT_TELEMETRY: 'false'
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install reviewed Bicep compiler
        run: az bicep install --version v0.46.1
      - name: Full exported Node and PowerShell suites
        run: npm test
      - name: Typecheck and build
        run: |
          npx tsc -p tsconfig.typecheck.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx tsc -p tsconfig.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compile every tracked Bicep template
        run: |
          $templates = @(git ls-files '*.bicep')
          if ($LASTEXITCODE -ne 0 -or $templates.Count -eq 0) { throw 'No tracked Bicep templates found.' }
          foreach ($template in $templates) {
            az bicep build --file $template --stdout 1>$null
            if ($LASTEXITCODE -ne 0) { throw "Bicep build failed: $template" }
          }
          Write-Host "Compiled $($templates.Count) Bicep templates."
