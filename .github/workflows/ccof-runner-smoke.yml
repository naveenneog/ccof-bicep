# Proves a CCOF runner pair (docs/runbooks/CICD-SETUP.md, section 6 step 6 and section 10): preflight, managed
# identity sign-in, private DNS, a Cosmos DB data plane read from the preview runner, the denied write and
# the unavailable deploy identity on the preview runner, and the deploy identity on the apply runner. Inputs windows
# and fips run the preview checks on a Windows or FIPS-mode runner instead.
# Manual only; it changes nothing in Azure. Needs the two runners, so it never runs on GitHub-hosted runners.
name: ccof-runner-smoke
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment stem (uses <env>-preview and <env>-apply)
        required: true
      cosmos_account:
        description: Cosmos DB account name (data plane read of database ccof)
        required: true
      workload_resource_group:
        description: Workload resource group (target of the denied write and of what-if)
        required: true
      deploy_client_id:
        description: Client ID of the deploy identity (must NOT be usable on the preview runner)
        required: true
      hook_negative:
        description: Only run a probe job on each runner without environment (from main it is accepted; from any other branch the job-started hook must refuse it)
        type: boolean
        default: false
      windows:
        description: Only run the Windows preview checks (runner labels ccof-preview and ccof-windows)
        type: boolean
        default: false
      fips:
        description: Only run the preview checks on a FIPS-mode Linux runner (runner labels ccof-preview and ccof-fips)
        type: boolean
        default: false
      dns_private_host:
        description: Optional. An azurewebsites.net host with a private A record (checked against dns_private_ip)
        default: ""
      dns_private_ip:
        description: Optional. Expected private address of dns_private_host
        default: ""
      dns_public_host:
        description: Optional. An azurewebsites.net host without a private record (must resolve to a public address through NxDomainRedirect fallback)
        default: ""
permissions:
  contents: read
concurrency:
  group: ccof-env-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  preview:
    if: ${{ !inputs.hook_negative && !inputs.windows }}
    runs-on: ${{ inputs.fips && fromJSON('["self-hosted", "ccof-preview", "ccof-fips"]') || fromJSON('["self-hosted", "ccof-vnet", "ccof-preview"]') }}
    environment: ${{ inputs.environment }}-preview
    env:
      COSMOS: ${{ inputs.cosmos_account }}
      RG: ${{ inputs.workload_resource_group }}
      DEPLOY_CLIENT_ID: ${{ inputs.deploy_client_id }}
    steps:
      - uses: actions/checkout@v4
      - name: Preflight
        run: bash scripts/cicd/Test-RunnerHost.sh --private-fqdns "$COSMOS.documents.azure.com" --bicep-version v0.46.1
      - id: login
        uses: ./.github/actions/azure-login-mi
        with:
          expected-role: preview
      - name: Signed-in identity
        run: az account show --query "{subscription:id, tenant:tenantId, user:user}" -o json
      # FIPS host only. Functional smoke, not a compliance test: fails unless FIPS mode is on and the Azure CLI, Bicep, git and pwsh work; the MD5 lines
      # record which tools use the system FIPS module (an official Node.js build bundles its own OpenSSL).
      - name: FIPS mode and tools
        if: ${{ inputs.fips }}
        run: |
          set -uo pipefail
          fips=$(cat /proc/sys/crypto/fips_enabled 2>/dev/null || echo 0)
          echo "fips_enabled=$fips; crypto policy: $(update-crypto-policies --show 2>/dev/null || echo n/a)"
          [ "$fips" = 1 ] || { echo "::error::FIPS mode is not on"; exit 1; }
          if openssl md5 /dev/null >/dev/null 2>&1; then echo "::error::system OpenSSL computed MD5 in FIPS mode"; exit 1; fi
          echo "PASS system OpenSSL refuses MD5"
          printf 'param name string = %s\noutput n string = name\n' "'fips'" > fips.bicep
          bicep build fips.bicep --stdout | jq -e '.outputs.n' >/dev/null || { echo "::error::bicep build failed"; exit 1; }
          echo "PASS bicep $(bicep --version | awk '{print $4}') build"
          git ls-remote --heads "https://github.com/$GITHUB_REPOSITORY" >/dev/null 2>&1 || { echo "::error::git HTTPS ls-remote failed"; exit 1; }
          echo "PASS git HTTPS ls-remote (with the job token that actions/checkout keeps in the workspace)"
          pwsh -NoProfile -Command '[Convert]::ToHexString([Security.Cryptography.SHA256]::HashData([byte[]](1,2,3)))' >/dev/null || { echo "::error::pwsh SHA-256 failed"; exit 1; }
          echo "PASS pwsh SHA-256"
          pwsh -NoProfile -Command '[Security.Cryptography.MD5]::HashData([byte[]](1))' >/dev/null 2>&1 && echo "RESULT pwsh (.NET) computes MD5" || echo "RESULT pwsh (.NET) refuses MD5 (uses the system OpenSSL FIPS provider)"
          echo "node $(node --version), OpenSSL $(node -p 'process.versions.openssl'), crypto.getFips()=$(node -p 'require("crypto").getFips()')"
          node -e 'require("crypto").createHash("md5").update("x").digest("hex")' 2>/dev/null && echo "RESULT node computes MD5: it does not use the system FIPS module" || echo "RESULT node refuses MD5"
          azpy=$(head -n 5 "$(readlink -f "$(command -v az)")" | grep -o '/[^ "]*python[0-9.]*' | head -n 1)
          [ -n "$azpy" ] && "$azpy" -c 'import hashlib; hashlib.md5(b"x")' 2>/dev/null && echo "RESULT az Python ($azpy) computes MD5" || echo "RESULT az Python ($azpy) refuses MD5"
          az account get-access-token --query expiresOn -o tsv >/dev/null || { echo "::error::az token request failed"; exit 1; }
          echo "PASS az $(az version --query '"azure-cli"' -o tsv) token in FIPS mode"
      - name: Cosmos DB data plane read over the private endpoint
        run: |
          set -euo pipefail
          host="$COSMOS.documents.azure.com"
          ip=$(getent hosts "$host" | awk '{print $1; exit}')
          echo "$host -> $ip"
          case "$ip" in 10.*|172.1[6-9].*|172.2[0-9].*|172.3[01].*|192.168.*|100.6[4-9].*|100.[7-9][0-9].*|100.1[01][0-9].*|100.12[0-7].*) ;; *) echo "::error::$host does not resolve to a private address"; exit 1 ;; esac
          token=$(az account get-access-token --resource "https://$host" --query accessToken -o tsv)
          auth=$(printf 'type=aad&ver=1.0&sig=%s' "$token" | jq -sRr @uri)
          code=$(curl -sS -o colls.json -w '%{http_code}' "https://$host/dbs/ccof/colls" -H "Authorization: $auth" \
            -H "x-ms-date: $(LC_ALL=C date -u '+%a, %d %b %Y %H:%M:%S GMT')" -H 'x-ms-version: 2018-12-31')
          echo "GET /dbs/ccof/colls -> HTTP $code"
          [ "$code" = 200 ] || { cat colls.json; exit 1; }
          jq -r '"containers: " + ([.DocumentCollections[].id] | join(", "))' colls.json
      - name: Private DNS zone with fallback (read-only)
        if: ${{ inputs.dns_private_host != '' }}
        env:
          PRIV_HOST: ${{ inputs.dns_private_host }}
          PRIV_IP: ${{ inputs.dns_private_ip }}
          PUB_HOST: ${{ inputs.dns_public_host }}
        run: |
          set -euo pipefail
          private() { case "$1" in 10.*|172.1[6-9].*|172.2[0-9].*|172.3[01].*|192.168.*|100.6[4-9].*|100.[7-9][0-9].*|100.1[01][0-9].*|100.12[0-7].*) return 0 ;; *) return 1 ;; esac; }
          ip=$(getent hosts "$PRIV_HOST" | awk '{print $1; exit}')
          echo "$PRIV_HOST -> $ip"
          [ "$ip" = "$PRIV_IP" ] || { echo "::error::$PRIV_HOST resolved to '$ip', expected $PRIV_IP"; exit 1; }
          if [ -n "$PUB_HOST" ]; then
            pip=$(getent hosts "$PUB_HOST" | awk '{print $1; exit}')
            echo "$PUB_HOST -> $pip"
            [ -n "$pip" ] && ! private "$pip" || { echo "::error::$PUB_HOST did not fall back to a public address"; exit 1; }
          fi
          echo "PASS private record and public fallback"
      - name: Negative - the preview identity cannot write
        run: |
          set -uo pipefail
          out=$(az group update --name "$RG" --set tags.ccof-smoke=denied -o none 2>&1) && code=0 || code=$?
          echo "$out" | head -n 3
          [ $code -ne 0 ] && echo "$out" | grep -q AuthorizationFailed || { echo "::error::write was not denied with AuthorizationFailed"; exit 1; }
          echo "PASS write denied (AuthorizationFailed)"
      - name: Negative - the deploy identity is not available on the preview runner
        run: |
          set -uo pipefail
          export AZURE_CONFIG_DIR="$RUNNER_TEMP/neg-azcfg"; mkdir -p "$AZURE_CONFIG_DIR"
          out=$(az login --identity --client-id "$DEPLOY_CLIENT_ID" --allow-no-subscriptions -o none 2>&1) && code=0 || code=$?
          rm -rf "$AZURE_CONFIG_DIR"
          echo "$out" | head -n 3
          [ $code -ne 0 ] || { echo "::error::the deploy identity signed in on the preview runner"; exit 1; }
          echo "PASS deploy identity refused on the preview runner"
      - id: wrongrole
        name: Negative - expected-role apply on the preview runner (must fail)
        continue-on-error: true
        uses: ./.github/actions/azure-login-mi
        with:
          expected-role: apply
      - name: Negative - check the role mismatch was refused
        env:
          OUTCOME: ${{ steps.wrongrole.outcome }}
        run: |
          [ "$OUTCOME" = failure ] || { echo "::error::expected-role apply was accepted on the preview runner"; exit 1; }
          echo "PASS expected-role apply refused on the preview runner"
      # Learn: what-if needs the same permissions as a deployment. Calls the REST API so the ARM error code is shown.
      - name: What-if with the preview identity (result recorded, either outcome passes)
        run: |
          sub=$(az account show --query id -o tsv)
          body='{"properties":{"mode":"Incremental","template":{"$schema":"https://schema.management.azure.com/schemas/2019-04-01/deploymentTemplate.json#","contentVersion":"1.0.0.0","resources":[]}}}'
          out=$(az rest --method post --url "https://management.azure.com/subscriptions/$sub/resourcegroups/$RG/providers/Microsoft.Resources/deployments/ccof-smoke-whatif/whatIf?api-version=2024-03-01" --body "$body" 2>&1) && code=0 || code=$?
          echo "$out" | head -n 3
          if [ $code -eq 0 ]; then echo "RESULT what-if accepted for the preview identity"
          elif echo "$out" | grep -q AuthorizationFailed; then echo "RESULT what-if denied for the preview identity (AuthorizationFailed)"
          else echo "::error::what-if failed for another reason"; exit 1; fi
      - if: always()
        uses: ./.github/actions/azure-login-mi
        with:
          mode: logout

  apply:
    if: ${{ !inputs.hook_negative && !inputs.windows && !inputs.fips }}
    needs: preview
    runs-on: [self-hosted, ccof-vnet, ccof-apply]
    environment: ${{ inputs.environment }}-apply
    env:
      COSMOS: ${{ inputs.cosmos_account }}
      RG: ${{ inputs.workload_resource_group }}
    steps:
      - uses: actions/checkout@v4
      - name: Preflight
        run: bash scripts/cicd/Test-RunnerHost.sh --private-fqdns "$COSMOS.documents.azure.com" --bicep-version v0.46.1
      - uses: ./.github/actions/azure-login-mi
        with:
          expected-role: apply
      - name: Signed-in identity
        run: az account show --query "{subscription:id, tenant:tenantId, user:user}" -o json
      - name: What-if with the deploy identity (no change)
        run: |
          echo '{"$schema":"https://schema.management.azure.com/schemas/2019-04-01/deploymentTemplate.json#","contentVersion":"1.0.0.0","resources":[]}' > empty.json
          az deployment group what-if --resource-group "$RG" --template-file empty.json --no-pretty-print --query status -o tsv
      - if: always()
        uses: ./.github/actions/azure-login-mi
        with:
          mode: logout

  hook-negative:
    if: ${{ inputs.hook_negative && !inputs.windows && !inputs.fips }}
    strategy:
      fail-fast: false
      matrix:
        role: [ccof-preview, ccof-apply]
    runs-on: [self-hosted, ccof-vnet, "${{ matrix.role }}"]
    steps:
      # From main: accepted (the hook prints the accepted context). From any other branch, event or workflow: the
      # job fails at "Set up job" with "ccof-runner: job refused". A green job off main means the hook is not enforced.
      - run: echo "::warning::accepted by the job-started hook ($GITHUB_EVENT_NAME on $GITHUB_REF)"

  preview-windows:
    if: ${{ inputs.windows && !inputs.hook_negative }}
    runs-on: [self-hosted, ccof-preview, ccof-windows]
    environment: ${{ inputs.environment }}-preview
    defaults:
      run:
        shell: pwsh
    env:
      COSMOS: ${{ inputs.cosmos_account }}
      RG: ${{ inputs.workload_resource_group }}
      DEPLOY_CLIENT_ID: ${{ inputs.deploy_client_id }}
    steps:
      - uses: actions/checkout@v4
      - name: Preflight
        run: ./scripts/cicd/Test-RunnerHost.ps1 -PrivateFqdns "$env:COSMOS.documents.azure.com" -BicepVersion v0.46.1
      - uses: ./.github/actions/azure-login-mi
        with:
          expected-role: preview
      - name: Cosmos DB data plane read over the private endpoint
        run: |
          $h = "$env:COSMOS.documents.azure.com"
          $ip = ([Net.Dns]::GetHostAddresses($h) | Where-Object AddressFamily -eq InterNetwork | Select-Object -First 1).IPAddressToString
          "$h -> $ip"
          if ($ip -notmatch '^(10\.|172\.(1[6-9]|2\d|3[01])\.|192\.168\.|100\.(6[4-9]|[7-9]\d|1[01]\d|12[0-7])\.)') { throw "$h does not resolve to a private address" }
          $token = az account get-access-token --resource "https://$h" --query accessToken -o tsv
          $auth = [uri]::EscapeDataString("type=aad&ver=1.0&sig=$token")
          $r = Invoke-WebRequest -SkipHttpErrorCheck -Uri "https://$h/dbs/ccof/colls" -Headers @{ Authorization = $auth; 'x-ms-date' = [DateTime]::UtcNow.ToString('r'); 'x-ms-version' = '2018-12-31' }
          "GET /dbs/ccof/colls -> HTTP $($r.StatusCode)"
          if ($r.StatusCode -ne 200) { throw $r.Content }
      - name: Negative - the preview identity cannot write
        run: |
          $out = az group update --name $env:RG --set tags.ccof-smoke=denied -o none 2>&1 | Out-String
          $code = $LASTEXITCODE; $global:LASTEXITCODE = 0
          ($out -split "`n" | Select-Object -First 3) -join "`n"
          if ($code -eq 0 -or $out -notmatch 'AuthorizationFailed') { throw 'write was not denied with AuthorizationFailed' }
          'PASS write denied (AuthorizationFailed)'
      - name: Negative - the deploy identity is not available on the preview runner
        run: |
          $env:AZURE_CONFIG_DIR = Join-Path $env:RUNNER_TEMP 'neg-azcfg'; New-Item -ItemType Directory -Force $env:AZURE_CONFIG_DIR | Out-Null
          $out = az login --identity --client-id $env:DEPLOY_CLIENT_ID --allow-no-subscriptions -o none 2>&1 | Out-String
          $code = $LASTEXITCODE; $global:LASTEXITCODE = 0
          Remove-Item -Recurse -Force $env:AZURE_CONFIG_DIR
          ($out -split "`n" | Select-Object -First 3) -join "`n"
          if ($code -eq 0) { throw 'the deploy identity signed in on the preview runner' }
          'PASS deploy identity refused on the preview runner'
      - if: always()
        uses: ./.github/actions/azure-login-mi
        with:
          mode: logout

  hook-negative-windows:
    if: ${{ inputs.windows && inputs.hook_negative }}
    runs-on: [self-hosted, ccof-preview, ccof-windows]
    steps:
      - run: echo "::warning::accepted by the job-started hook ($env:GITHUB_EVENT_NAME on $env:GITHUB_REF)"
        shell: pwsh