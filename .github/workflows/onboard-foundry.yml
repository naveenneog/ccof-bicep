name: onboard-foundry

# Adds a new Microsoft Foundry account (backend) to an existing deployment in region A and the region B
# standby (docs/runbooks/CICD-FOUNDRY-ONBOARDING.md). Sign-in is the runner host's managed identity
# (.github/actions/azure-login-mi); there is no Azure secret, variable or federated credential in GitHub.
# - pull_request: an offline check on a GitHub-hosted runner. Pull request code never runs on the private
#   self-hosted runners and never gets a managed identity.
# - workflow_dispatch from main (reviewed, merged configuration): a GitHub-hosted resolve job first proves the
#   GitHub environments (main-only branch policy; reviewers and an enforcing plan for apply), then validate
#   with Azure reads on ccof-preview, what-if previews on ccof-apply (what-if needs deploy permissions), then,
#   with apply, the private link gate if needed and the apply. Every self-hosted job runs in a GitHub
#   environment whose deployment branch policy allows main only; <env>-gate-privatelink and <env>-apply also
#   need reviewers.
# Steps run through scripts/cicd/Invoke-CicdOnboardingStep.ps1, which never runs Stage 7 or Stage 8.
# The job conditions below come from the dispatched branch, which its author can edit, so they are not the
# control: the runner host's job-started hook (scripts/cicd/Install-CcofRunner.*, both runners) refuses any
# job that is not workflow_dispatch of an allow-listed workflow on refs/heads/main, and the environments
# allow main only. Keep the triggers to pull_request and workflow_dispatch, with no chained or reusable
# workflows (tests/onboard-foundry-workflow.test.ts).

on:
  pull_request:
    paths:
      - 'deploy/*/staged.config.json'
  workflow_dispatch:
    inputs:
      environment:
        description: 'deploy/<environment> folder, for example stg'
        required: true
        type: string
      backend_ids:
        description: 'Comma-separated ids of the backends appended to backends[] (merged on main)'
        required: true
        type: string
      apply:
        description: 'Apply after the previews (approval in <environment>-apply)'
        type: boolean
        default: false

permissions:
  contents: read

# One run per environment at a time, shared with every workflow that changes it (ccof-env-<env>). queue: max
# keeps up to 100 pending runs in order instead of replacing the pending one; beyond 100 GitHub cancels new runs.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('onboard-foundry-pr-{0}', github.event.pull_request.number) || format('ccof-env-{0}', inputs.environment) }}
  cancel-in-progress: false
  queue: max

defaults:
  run:
    shell: pwsh

jobs:
  pr-check:
    name: offline check (pull request, GitHub-hosted)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Offline validate (configuration only; no Azure, no driver state)
        env:
          CCOF_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          $changed = @(git diff --name-only "$env:CCOF_BASE_SHA" HEAD -- 'deploy/*/staged.config.json')
          if ($LASTEXITCODE) { throw 'git diff failed' }
          $envs = @($changed | ForEach-Object { ($_ -split '/')[1] } | Sort-Object -Unique)
          if ($envs.Count -ne 1) { throw "change exactly one deploy/<env>/staged.config.json per pull request (found: $($envs -join ', '))" }
          $e = $envs[0]
          $null = New-Item -ItemType Directory -Force -Path "evidence/$e"
          $base = "evidence/$e/base.staged.config.json"
          git show "$($env:CCOF_BASE_SHA):deploy/$e/staged.config.json" | Set-Content -LiteralPath $base -Encoding utf8NoBOM
          if ($LASTEXITCODE) { throw "deploy/$e/staged.config.json does not exist on the base branch: onboarding adds to an existing deployment" }
          & ./scripts/cicd/Invoke-CicdOnboardingStep.ps1 -Environment $e -Step validate -BaseConfigPath $base -Offline
          exit $LASTEXITCODE

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: onboard-evidence-pr-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: ignore
          retention-days: 30

  # GitHub-hosted, before any self-hosted job: proves that <env>-preview admits only the protected default
  # branch and, with apply, that <env>-apply and <env>-gate-privatelink also have required reviewers that
  # administrators cannot bypass (scripts/cicd/Test-CicdGitHubEnvironments.ps1). The job token cannot read an
  # organization's plan; that finding is not proved here, and each reviewed job proves enforcement by its own
  # approval in this run (Assert-CicdApproval.ps1). GitHub creates a missing environment unprotected when a
  # job names it, so a missing or unprotected environment stops the run here.
  # The gate environment is required on every apply run because the need for it is known only after validate.
  # Cancelling the run stops the apply job: GitHub re-evaluates a running job's `if` on cancellation.
  resolve:
    name: GitHub environment protections (GitHub-hosted)
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      environment: ${{ steps.scope.outputs.environment }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Scope
        id: scope
        env:
          CCOF_INPUT_ENV: ${{ inputs.environment }}
          CCOF_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          $e = $env:CCOF_INPUT_ENV
          if ($e -cnotmatch '^[a-z0-9][a-z0-9-]{0,30}$') { throw "invalid environment '$e'" }
          # A clear early message; the control is the environment branch policy proved below.
          if ($env:GITHUB_REF -ne "refs/heads/$env:CCOF_DEFAULT_BRANCH") { throw "dispatch from $env:GITHUB_REF refused; run from the default branch" }
          "environment=$e" | Add-Content -LiteralPath $env:GITHUB_OUTPUT

      - name: GitHub environment protections (branch policy, reviewers, plan)
        env:
          GH_TOKEN: ${{ github.token }}
          CCOF_ENV: ${{ steps.scope.outputs.environment }}
          CCOF_APPLY: ${{ inputs.apply }}
        run: |
          $gates = if ($env:CCOF_APPLY -eq 'true') { 'apply,gate-privatelink' } else { '' }
          & ./scripts/cicd/Test-CicdGitHubEnvironments.ps1 -Repository $env:GITHUB_REPOSITORY -Environment $env:CCOF_ENV -ReviewedGate $gates
          exit $LASTEXITCODE

  validate:
    name: validate (Azure reads)
    needs: resolve
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, ccof-vnet, ccof-preview]
    environment: ${{ needs.resolve.outputs.environment }}-preview
    timeout-minutes: 20
    outputs:
      environment: ${{ steps.scope.outputs.environment }}
      backend-ids: ${{ steps.validate.outputs.backend-ids }}
      needs-privatelink-gate: ${{ steps.validate.outputs.needs-privatelink-gate }}
      has-standby: ${{ steps.validate.outputs.has-standby }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # The preflight matching the host OS (docs/runbooks/CICD-SETUP.md): a hardened Windows host needs no Bash.
      - name: Runner host preflight (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: bash scripts/cicd/Test-RunnerHost.sh
      - name: Runner host preflight (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: pwsh -NoProfile -File scripts/cicd/Test-RunnerHost.ps1
      - name: Runner host preflight (unsupported OS)
        if: runner.os != 'Linux' && runner.os != 'Windows'
        shell: pwsh
        run: |
          Write-Error "Runner OS $env:RUNNER_OS has no CCOF preflight; only Linux and Windows hosts are supported."
          exit 1

      - name: Scope
        id: scope
        env:
          CCOF_INPUT_ENV: ${{ inputs.environment }}
        run: |
          $e = $env:CCOF_INPUT_ENV
          if ($e -cnotmatch '^[a-z0-9][a-z0-9-]{0,30}$') { throw "invalid environment '$e'" }
          "environment=$e" | Add-Content -LiteralPath $env:GITHUB_OUTPUT

      - name: Azure sign-in (runner managed identity)
        uses: ./.github/actions/azure-login-mi
        with:
          expected-role: preview

      - name: Restore driver state (read only)
        env:
          CCOF_STATE_TOKEN: ${{ github.token }}
          CCOF_ENV: ${{ steps.scope.outputs.environment }}
        run: pwsh scripts/cicd/Sync-CicdState.ps1 -Action Restore -Environment $env:CCOF_ENV

      - name: Validate the new backends (configuration, Foundry account, region B coverage)
        id: validate
        env:
          CCOF_ENV: ${{ steps.scope.outputs.environment }}
          CCOF_IDS: ${{ inputs.backend_ids }}
        run: |
          & ./scripts/cicd/Invoke-CicdOnboardingStep.ps1 -Environment $env:CCOF_ENV -Step validate -BackendIds $env:CCOF_IDS
          exit $LASTEXITCODE

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: onboard-evidence-validate-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: ignore
          retention-days: 90

      - name: Azure sign-out
        if: always()
        uses: ./.github/actions/azure-login-mi
        with:
          mode: logout
  preview:
    name: preview (what-if, region A and B)
    needs: [resolve, validate]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, ccof-vnet, ccof-apply]
    environment: ${{ needs.resolve.outputs.environment }}-preview
    timeout-minutes: 60
    env:
      CCOF_ENV: ${{ needs.validate.outputs.environment }}
      CCOF_IDS: ${{ needs.validate.outputs.backend-ids }}
      CCOF_HAS_STANDBY: ${{ needs.validate.outputs.has-standby }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # The preflight matching the host OS (docs/runbooks/CICD-SETUP.md): a hardened Windows host needs no Bash.
      - name: Runner host preflight (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: bash scripts/cicd/Test-RunnerHost.sh
      - name: Runner host preflight (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: pwsh -NoProfile -File scripts/cicd/Test-RunnerHost.ps1
      - name: Runner host preflight (unsupported OS)
        if: runner.os != 'Linux' && runner.os != 'Windows'
        shell: pwsh
        run: |
          Write-Error "Runner OS $env:RUNNER_OS has no CCOF preflight; only Linux and Windows hosts are supported."
          exit 1

      - name: Azure sign-in (runner managed identity)
        uses: ./.github/actions/azure-login-mi
        with:
          expected-role: apply

      - name: Restore driver state (read only)
        env:
          CCOF_STATE_TOKEN: ${{ github.token }}
        run: pwsh scripts/cicd/Sync-CicdState.ps1 -Action Restore -Environment $env:CCOF_ENV

      - name: Region A Stage 3, 5, 6 and region B Backends what-if; descriptor preview
        run: |
          $failed = @()
          $steps = @('stage3', 'stage5', 'stage6')
          if ($env:CCOF_HAS_STANDBY -eq 'true') { $steps += 'standby-backends' }
          $steps += 'descriptor'
          foreach ($s in $steps) {
            & ./scripts/cicd/Invoke-CicdOnboardingStep.ps1 -Environment $env:CCOF_ENV -Step $s -BackendIds $env:CCOF_IDS
            if ($LASTEXITCODE) { $failed += $s }
          }
          if ($failed.Count) { throw "preview failed: $($failed -join ', ')" }

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: onboard-evidence-preview-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: ignore
          retention-days: 90

      - name: Azure sign-out
        if: always()
        uses: ./.github/actions/azure-login-mi
        with:
          mode: logout

  gate-privatelink:
    name: private link approved (gate)
    needs: [resolve, validate, preview]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.apply && needs.validate.outputs.needs-privatelink-gate == 'true'
    runs-on: [self-hosted, ccof-vnet, ccof-preview]
    environment: ${{ needs.resolve.outputs.environment }}-gate-privatelink
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    env:
      CCOF_ENV: ${{ needs.validate.outputs.environment }}
      CCOF_IDS: ${{ needs.validate.outputs.backend-ids }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # The preflight matching the host OS (docs/runbooks/CICD-SETUP.md): a hardened Windows host needs no Bash.
      - name: Runner host preflight (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: bash scripts/cicd/Test-RunnerHost.sh
      - name: Runner host preflight (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: pwsh -NoProfile -File scripts/cicd/Test-RunnerHost.ps1
      - name: Runner host preflight (unsupported OS)
        if: runner.os != 'Linux' && runner.os != 'Windows'
        shell: pwsh
        run: |
          Write-Error "Runner OS $env:RUNNER_OS has no CCOF preflight; only Linux and Windows hosts are supported."
          exit 1

      # Before any Azure call: the reviewer approval of this environment must have been enforced in this run.
      - name: Verify the gate approval
        env:
          CCOF_APPROVAL_TOKEN: ${{ github.token }}
        run: pwsh scripts/cicd/Assert-CicdApproval.ps1 -Environment $env:CCOF_ENV -GitHubEnvironment "$env:CCOF_ENV-gate-privatelink"

      - name: Checklist
        run: |
          @('### Private link for the new Foundry account',
            '',
            "Approve this environment only after the network team created the private endpoint for $env:CCOF_IDS in the workload VNet",
            '(zone group on the shared privatelink.cognitiveservices.azure.com / privatelink.services.ai.azure.com zones)',
            'and the Foundry owner approved the connection. The job then proves it: an Approved connection and a private DNS answer from this runner.',
            '') | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY

      - name: Azure sign-in (runner managed identity)
        uses: ./.github/actions/azure-login-mi
        with:
          expected-role: preview

      - name: Restore driver state (read only)
        env:
          CCOF_STATE_TOKEN: ${{ github.token }}
        run: pwsh scripts/cicd/Sync-CicdState.ps1 -Action Restore -Environment $env:CCOF_ENV

      - name: Validate with the private link required
        run: |
          & ./scripts/cicd/Invoke-CicdOnboardingStep.ps1 -Environment $env:CCOF_ENV -Step validate -BackendIds $env:CCOF_IDS -RequirePrivateLink
          exit $LASTEXITCODE

      - name: Azure sign-out
        if: always()
        uses: ./.github/actions/azure-login-mi
        with:
          mode: logout

  apply:
    name: apply (region A, region B, descriptor, smoke)
    needs: [resolve, validate, preview, gate-privatelink]
    if: >-
      always() && !cancelled() && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.apply
      && needs.resolve.result == 'success' && needs.validate.result == 'success' && needs.preview.result == 'success'
      && (needs.gate-privatelink.result == 'success' || (needs.gate-privatelink.result == 'skipped' && needs.validate.outputs.needs-privatelink-gate != 'true'))
    runs-on: [self-hosted, ccof-vnet, ccof-apply]
    environment: ${{ needs.resolve.outputs.environment }}-apply
    timeout-minutes: 120
    permissions:
      contents: write
      actions: read
    env:
      CCOF_ENV: ${{ needs.validate.outputs.environment }}
      CCOF_IDS: ${{ needs.validate.outputs.backend-ids }}
      CCOF_HAS_STANDBY: ${{ needs.validate.outputs.has-standby }}
    steps:
      - uses: actions/checkout@v4

      # The preflight matching the host OS (docs/runbooks/CICD-SETUP.md): a hardened Windows host needs no Bash.
      - name: Runner host preflight (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: bash scripts/cicd/Test-RunnerHost.sh
      - name: Runner host preflight (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: pwsh -NoProfile -File scripts/cicd/Test-RunnerHost.ps1
      - name: Runner host preflight (unsupported OS)
        if: runner.os != 'Linux' && runner.os != 'Windows'
        shell: pwsh
        run: |
          Write-Error "Runner OS $env:RUNNER_OS has no CCOF preflight; only Linux and Windows hosts are supported."
          exit 1

      # Before any Azure call. Fails closed when <env>-apply has no required reviewers (private repositories
      # need GitHub Enterprise), lets administrators bypass them (or bypass is unreadable), allows other
      # branches, was bypassed, has more than one approval in this run, or this is a re-run attempt. The gate
      # approval is re-read from this run's review history (no second review). The step runner refuses every
      # -Apply without this record.
      - name: Verify the apply approval (and the private link gate approval when it was needed)
        env:
          CCOF_APPROVAL_TOKEN: ${{ github.token }}
          CCOF_GATE_NEEDED: ${{ needs.validate.outputs.needs-privatelink-gate }}
        run: |
          pwsh scripts/cicd/Assert-CicdApproval.ps1 -Environment $env:CCOF_ENV -GitHubEnvironment "$env:CCOF_ENV-apply"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if ($env:CCOF_GATE_NEEDED -eq 'true') {
            pwsh scripts/cicd/Assert-CicdApproval.ps1 -Environment $env:CCOF_ENV -GitHubEnvironment "$env:CCOF_ENV-gate-privatelink"
            exit $LASTEXITCODE
          }

      - name: Azure sign-in (runner managed identity)
        uses: ./.github/actions/azure-login-mi
        with:
          expected-role: apply

      # The checkout's stored credentials authenticate Restore and Save here; CCOF_STATE_TOKEN would add a
      # second Authorization header, which GitHub rejects.
      - name: Restore driver state (cicd-state/${{ needs.resolve.outputs.environment }})
        id: restore
        run: pwsh scripts/cicd/Sync-CicdState.ps1 -Action Restore -Environment $env:CCOF_ENV

      - name: Apply in order (stops at the first failure)
        id: drive
        run: |
          $done = "evidence/$env:CCOF_ENV/onboard-completed.txt"
          $null = New-Item -ItemType Directory -Force -Path (Split-Path $done -Parent)
          Set-Content -LiteralPath $done -Value @()
          Set-Content -LiteralPath "evidence/$env:CCOF_ENV/onboard-driver-started.txt" -Value "$env:GITHUB_RUN_ID/$env:GITHUB_RUN_ATTEMPT"
          $hasFd = Test-Path -LiteralPath "deploy/$env:CCOF_ENV/.dr-state/frontdoor-state.json"
          $plan = @(
            @{ Step = 'validate'; RequirePrivateLink = $true },
            @{ Step = 'stage3'; Apply = $true },
            @{ Step = 'stage5'; Apply = $true },
            @{ Step = 'stage6'; Apply = $true })
          if ($env:CCOF_HAS_STANDBY -eq 'true') { $plan += @(@{ Step = 'standby-backends'; Apply = $true }, @{ Step = 'standby-verify' }) }
          if ($env:CCOF_HAS_STANDBY -eq 'true' -and $hasFd) { $plan += @{ Step = 'frontdoor-verify' } }
          $plan += @(@{ Step = 'descriptor'; Apply = $true }, @{ Step = 'smoke' })
          foreach ($p in $plan) {
            & ./scripts/cicd/Invoke-CicdOnboardingStep.ps1 -Environment $env:CCOF_ENV -BackendIds $env:CCOF_IDS @p
            if ($LASTEXITCODE) { throw "$($p.Step) failed (exit $LASTEXITCODE)" }
            Add-Content -LiteralPath $done -Value $p.Step
          }

      - name: Rollback guidance
        if: failure()
        run: |
          Import-Module ./scripts/cicd/CicdOnboarding.psm1
          $done = @(Get-Content -LiteralPath "evidence/$env:CCOF_ENV/onboard-completed.txt" -ErrorAction SilentlyContinue | Where-Object { $_ })
          $lines = Get-CicdOnboardingRollback -Environment $env:CCOF_ENV -BackendIds ($env:CCOF_IDS -split ',') -Completed $done
          $lines | Write-Host
          @('### Onboarding failed', '') + ($lines | ForEach-Object { "- $_" }) | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY

      # Only state restored in this job and changed by a driver that started is saved: after a partial failure
      # or a cancellation the applied part is recorded; after an early failure (approval, sign-in, checkout,
      # restore) nothing is saved, so the branch state is never replaced by an empty or stale working copy.
      - name: Save driver state
        if: always() && steps.restore.outcome == 'success' && (steps.drive.outcome == 'success' || steps.drive.outcome == 'failure' || steps.drive.outcome == 'cancelled')
        run: |
          if (-not (Test-Path -LiteralPath "evidence/$env:CCOF_ENV/onboard-driver-started.txt")) {
            Write-Host 'No onboarding step started in this job: driver state not saved.'
            exit 0
          }
          pwsh scripts/cicd/Sync-CicdState.ps1 -Action Save -Environment $env:CCOF_ENV -Message "onboard-foundry $env:CCOF_IDS run $env:GITHUB_RUN_ID/$env:GITHUB_RUN_ATTEMPT"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: onboard-evidence-apply-${{ github.run_attempt }}
          path: |
            evidence/
            deploy/${{ needs.validate.outputs.environment }}/.dr-evidence/
          if-no-files-found: ignore
          retention-days: 90

      - name: Azure sign-out
        if: always()
        uses: ./.github/actions/azure-login-mi
        with:
          mode: logout
