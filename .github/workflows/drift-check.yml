name: drift-check

# Scheduled read-only drift check (docs/runbooks/CICD-ENVIRONMENT-DEPLOYMENT.md, "Drift check").
# Runs the what-if previews of an environment and opens (or comments on) an issue when a preview shows
# Create, Delete or Modify, or when a preview failed or produced no recognized result. Nothing is applied and no driver state is saved. What-if needs deployment
# permissions, so the job runs on the apply runner inside <env>-preview (branch policy main, no reviewers).
# Environments: repository variable CCOF_DRIFT_ENVIRONMENTS, a JSON array such as ["prod"].

on:
  schedule:
    - cron: '17 3 * * 1-5'
  workflow_dispatch:
    inputs:
      environment:
        description: 'One environment (empty = CCOF_DRIFT_ENVIRONMENTS)'
        type: string
        default: ''

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: ccof-drift
  cancel-in-progress: false

jobs:
  # GitHub-hosted: validates the names and proves each <env>-preview admits only the protected default branch
  # before a job is scheduled on the self-hosted runner (an unknown environment name would be created unprotected).
  targets:
    if: vars.CCOF_DRIFT_ENVIRONMENTS != '' || inputs.environment != ''
    runs-on: ubuntu-latest
    permissions: { contents: read, actions: read }
    outputs:
      environments: ${{ steps.list.outputs.environments }}
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - id: list
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          CCOF_INPUT: ${{ inputs.environment }}
          CCOF_LIST: ${{ vars.CCOF_DRIFT_ENVIRONMENTS }}
        run: |
          $envs = if ($env:CCOF_INPUT) { @($env:CCOF_INPUT) } else { @($env:CCOF_LIST | ConvertFrom-Json) }
          $failed = 0
          foreach ($e in $envs) {
            if ($e -cnotmatch '^[a-z0-9][a-z0-9-]{0,30}$' -or $e -eq 'example' -or -not (Test-Path "deploy/$e/staged.config.json")) { throw "invalid environment '$e'" }
            & ./scripts/cicd/Test-CicdGitHubEnvironments.ps1 -Repository $env:GITHUB_REPOSITORY -Environment $e
            if ($LASTEXITCODE) { $failed++ }
          }
          if ($failed) { exit 1 }
          "environments=$(ConvertTo-Json -Compress -InputObject @($envs))" | Add-Content $env:GITHUB_OUTPUT

  drift:
    needs: targets
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJSON(needs.targets.outputs.environments) }}
    runs-on: [self-hosted, ccof-vnet, ccof-apply]
    environment: ${{ matrix.environment }}-preview
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    env:
      CCOF_ENV: ${{ matrix.environment }}
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }

      - name: Runner host preflight (Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: bash scripts/cicd/Test-RunnerHost.sh

      - name: Runner host preflight (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: pwsh -NoProfile -File scripts/cicd/Test-RunnerHost.ps1

      - name: Guard inputs
        run: |
          if ($env:CCOF_ENV -cnotmatch '^[a-z0-9][a-z0-9-]{0,30}$' -or -not (Test-Path "deploy/$env:CCOF_ENV/staged.config.json")) { throw "invalid environment '$env:CCOF_ENV'" }

      - name: Azure sign-in (runner managed identity)
        uses: ./.github/actions/azure-login-mi
        with:
          expected-role: apply

      - name: Restore driver state (read only, never saved)
        env:
          CCOF_STATE_TOKEN: ${{ github.token }}
        run: pwsh scripts/cicd/Sync-CicdState.ps1 -Action Restore -Environment $env:CCOF_ENV

      - name: Previews
        run: |
          $steps = @('staged-1', 'staged-2', 'staged-3', 'staged-5', 'staged-6')
          if (Test-Path "deploy/$env:CCOF_ENV/health-a.json") { $steps += 'health-a' }
          if (Test-Path "deploy/$env:CCOF_ENV/health-b.json") { $steps += 'health-b' }
          $failed = @()
          foreach ($s in $steps) {
            & ./scripts/cicd/Invoke-CicdDriver.ps1 -Environment $env:CCOF_ENV -Step $s
            if ($LASTEXITCODE) { $failed += "$s exit $LASTEXITCODE" }
          }
          "CCOF_EXPECTED_STEPS=$($steps -join ',')" | Add-Content $env:GITHUB_ENV
          if ($failed.Count) { "PREVIEW_FAILED=$($failed -join '; ')" | Add-Content $env:GITHUB_ENV }
          # The report and issue steps decide; a failed last preview must not skip them.
          exit 0

      - name: Drift report
        id: drift
        run: |
          pwsh scripts/cicd/Get-CicdDrift.ps1 -LogDirectory "evidence/$env:CCOF_ENV" -ExpectedStep $env:CCOF_EXPECTED_STEPS
          "drift=$([int]($LASTEXITCODE -ne 0 -or [bool]$env:PREVIEW_FAILED))" | Add-Content $env:GITHUB_OUTPUT
          exit 0

      - name: Open or update the drift issue
        if: steps.drift.outputs.drift == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $h = @{ Authorization = ('Bearer', $env:GH_TOKEN -join ' '); Accept = 'application/vnd.github+json' }
          $api = "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY"
          $title = "Drift: $env:CCOF_ENV"
          $md = Get-Content "evidence/$env:CCOF_ENV/drift.md" -Raw
          $body = "$md`n`nPreview failures: $(if ($env:PREVIEW_FAILED) { $env:PREVIEW_FAILED } else { 'none' })`n`nRun: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          $open = @(Invoke-RestMethod -Headers $h -Uri "$api/issues?state=open&labels=ccof-drift&per_page=100" | Where-Object { $_.title -ceq $title })
          if ($open.Count) { $null = Invoke-RestMethod -Method Post -Headers $h -Uri "$api/issues/$($open[0].number)/comments" -Body (@{ body = $body } | ConvertTo-Json) -ContentType 'application/json' }
          else { $null = Invoke-RestMethod -Method Post -Headers $h -Uri "$api/issues" -Body (@{ title = $title; body = $body; labels = @('ccof-drift') } | ConvertTo-Json) -ContentType 'application/json' }
          Write-Host "::warning::$title (see the issue)"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drift-${{ matrix.environment }}-${{ github.run_attempt }}
          path: evidence/${{ matrix.environment }}/
          if-no-files-found: ignore
          retention-days: 30

      - name: Azure sign-out
        if: always()
        uses: ./.github/actions/azure-login-mi
        with:
          mode: logout
